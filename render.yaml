services:
  - type: web
    name: snapsell-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: starter
    disk:
      name: snapsell-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SNAPSELL_DB
        value: /data/snapsell.db
      - key: SNAPSELL_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SNAPSELL_ADMIN_PASSWORD
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Set to this service's own URL once Render assigns it,
      # e.g. https://snapsell-api.onrender.com
      - key: SNAPSELL_SITE_URL
        sync: false
